<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Location scoring · Cluj-Napoca</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
  #map{position:absolute;inset:0}
  .legend{position:absolute;right:12px;top:12px;z-index:1000;background:#fff;padding:10px 12px;
    border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.2);font-size:13px;max-width:240px}
  .legend h4{margin:0 0 6px;font-size:13px}
  .legend .row{display:flex;align-items:center;margin:2px 0}
  .legend i{width:16px;height:12px;margin-right:7px;border-radius:2px;display:inline-block}
  .legend .sub{color:#6b7280;font-size:11px;margin-top:6px;line-height:1.4}
  .legend a{color:#2563eb;text-decoration:none}
  .title{position:absolute;left:12px;top:12px;z-index:1000;background:#fff;padding:8px 12px;
    border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.2);font-size:14px;font-weight:600;max-width:48%}
  .title small{display:block;font-weight:400;color:#6b7280;font-size:11px;margin-top:3px}
</style></head><body>
<div id="map"></div>
<div class="title">🔥 Pizzeria location scoring · Cluj-Napoca<small>Red = best spots. Multi-factor: residents + transit + retail + food places + offices − competitors.</small></div>
<div class="legend">
  <h4>Location score (0–100)</h4>
  <div id="buckets"></div>
  <div class="sub">250 m grid, residents estimated from OSM building stock.
    Same formula as in listing cards.<br>
    <a href="lokali.html">← listings map</a></div>
</div>
<script>
const map=L.map('map').setView([46.770,23.590],13);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
  {attribution:'© OpenStreetMap, © CARTO',maxZoom:19}).addTo(map);
const STOPS=[[80,'#800026'],[70,'#bd0026'],[60,'#e31a1c'],[50,'#fc4e2a'],
             [40,'#fd8d3c'],[30,'#feb24c'],[20,'#fed976'],[0,'#ffffcc']];
function col(s){ for(const [t,c] of STOPS){ if(s>=t) return c; } return '#ffffcc'; }
fetch('score_heatmap_cluj.geojson').then(r=>r.json()).then(gj=>{
  L.geoJSON(gj,{
    style:f=>({fillColor:col(f.properties.score),weight:0.3,color:'#888',fillOpacity:0.68}),
    onEachFeature:(f,l)=>{const p=f.properties;
      l.bindPopup(`Score <b>${p.score}/100</b><hr style="margin:4px 0;border:0;border-top:1px solid #eee">`+
        `👥 ~${Number(p.res500).toLocaleString('en')} residents in 500 m<br>`+
        `🚏 ${p.transit} transit · 🛍 ${p.shops} shops · 🍽 ${p.food} food places<br>`+
        `🏢 ${p.offices} offices · ⚔️ ${p.comp} competitors in 200 m`);}
  }).addTo(map);
});
const bk=document.getElementById('buckets');
const labels=['80+ 🟥','70–80','60–70','50–60','40–50','30–40','20–30','< 20'];
STOPS.forEach((s,i)=>bk.insertAdjacentHTML('beforeend',
  `<div class="row"><i style="background:${s[1]}"></i>${labels[i]}</div>`));
</script></body></html>
