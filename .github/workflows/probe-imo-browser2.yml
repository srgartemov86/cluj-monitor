name: probe-imo-browser2
on:
  workflow_dispatch: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        attempt: [a, b, c]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install camoufox
        run: |
          pip install playwright 'camoufox[geoip]'
          python -m playwright install-deps firefox
          python -m camoufox fetch
      - name: Probe
        run: python probe_imobiliare_browser2.py ${{ matrix.attempt }}
