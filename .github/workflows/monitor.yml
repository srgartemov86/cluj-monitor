name: cluj-monitor

on:
  schedule:
    # Клуж = UTC+3 летом. Локально 08:25–22:25 каждые 2 часа → 05:25–19:25 UTC.
    # Часы перечислены явно: диапазон с шагом (5-19/2) GitHub может молча игнорировать.
    # (GitHub может задерживать cron на 5–15 мин — не страшно.)
    # Факт: GitHub исполняет слоты с задержкой 45-75 мин (свежий аккаунт) — это норма
    - cron: '25 5,7,9,11,13,15,17,19 * * *'
  workflow_dispatch: {}

concurrency:
  group: monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - run: npm install -g surge

      - name: Write Google OAuth token
        run: echo "$GOOGLE_TOKEN_JSON" > /tmp/google-token.json
        env:
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}

      - name: Surge auth (~/.netrc — gen_map деплоит только при его наличии)
        run: |
          printf 'machine surge.surge.sh\n  login %s\n  password %s\n' "$SURGE_LOGIN" "$SURGE_TOKEN" > ~/.netrc
          chmod 600 ~/.netrc
        env:
          SURGE_LOGIN: ${{ secrets.SURGE_LOGIN }}
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}

      - name: Run monitor cycle
        run: python driver.py
        env:
          CLUJ_DATA: ${{ github.workspace }}/data
          GOOGLE_TOKEN_PATH: /tmp/google-token.json
          TG_SESSION: ${{ secrets.TG_SESSION }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          SURGE_LOGIN: ${{ secrets.SURGE_LOGIN }}
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HALO_PROXY: ${{ secrets.HALO_PROXY }}
          PIZZA_QUIET: '1'

      - name: Watchdog belgrade-monitor
        if: always()
        run: python watchdog.py belgrade-monitor "Белград-монитор"
        env:
          WATCHDOG_PAT: ${{ secrets.WATCHDOG_PAT }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}

      - name: Watchdog budapest-monitor
        if: always()
        run: python watchdog.py budapest-monitor "Будапешт-монитор"
        env:
          WATCHDOG_PAT: ${{ secrets.WATCHDOG_PAT }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}

      - name: Commit state back
        if: always()
        run: |
          git config user.name "cluj-monitor-bot"
          git config user.email "bot@users.noreply.github.com"
          # -A data: явный список падает, если файла ещё нет, и state молча не коммитится
          git add -A data
          git diff --cached --quiet && exit 0
          git commit -m "cycle $(date -u +%Y-%m-%dT%H:%MZ)"
          # Раньше тут было `git pull --rebase || true; git push || true`: при
          # параллельном пуше ребейз конфликтовал, оба шага молча падали, и
          # состояние прогона ТЕРЯЛОСЬ — лот уже уехал в чат и таблицу, но в
          # state этого не оставалось, и следующий цикл слал его повторно.
          # Состояние раннера новее нашего data/, поэтому при конфликте берём своё.
          for i in 1 2 3; do
            git fetch -q origin main || true
            git merge -q -X ours origin/main -m "merge origin (keep runner state)" || git merge --abort || true
            git push -q && exit 0
            sleep 5
          done
          echo "state push failed after 3 attempts" >&2
          exit 1
