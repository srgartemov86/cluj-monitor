name: cluj-monitor

on:
  schedule:
    # Клуж = UTC+3 летом. Локально 08:25–22:25 каждые 2 часа → 05:25–19:25 UTC.
    # Часы перечислены явно: диапазон с шагом (5-19/2) GitHub может молча игнорировать.
    # (GitHub может задерживать cron на 5–15 мин — не страшно.)
    - cron: '25 5,7,9,11,13,15,17,19 * * *'
    # ВРЕМЕННЫЙ тест-слот для проверки планировщика (удалить после первого срабатывания)
    - cron: '48 11 * * *'
  workflow_dispatch: {}

concurrency:
  group: monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - run: npm install -g surge

      - name: Write Google OAuth token
        run: echo "$GOOGLE_TOKEN_JSON" > /tmp/google-token.json
        env:
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}

      - name: Surge auth (~/.netrc — gen_map деплоит только при его наличии)
        run: |
          printf 'machine surge.surge.sh\n  login %s\n  password %s\n' "$SURGE_LOGIN" "$SURGE_TOKEN" > ~/.netrc
          chmod 600 ~/.netrc
        env:
          SURGE_LOGIN: ${{ secrets.SURGE_LOGIN }}
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}

      - name: Run monitor cycle
        run: python driver.py
        env:
          CLUJ_DATA: ${{ github.workspace }}/data
          GOOGLE_TOKEN_PATH: /tmp/google-token.json
          TG_SESSION: ${{ secrets.TG_SESSION }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          SURGE_LOGIN: ${{ secrets.SURGE_LOGIN }}
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIZZA_QUIET: '1'

      - name: Commit state back
        if: always()
        run: |
          git config user.name "cluj-monitor-bot"
          git config user.email "bot@users.noreply.github.com"
          # -A data: git add с явным списком атомарно падает, если какого-то файла
          # ещё нет (unaddressed.log) — и тогда state молча не коммитится (баг 1-го прогона)
          git add -A data
          git diff --cached --quiet || git commit -m "cycle $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main || true
          git push || true
