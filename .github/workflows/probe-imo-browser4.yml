name: probe-imo-browser4
on:
  workflow_dispatch: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install camoufox
        run: |
          pip install playwright camoufox
          python -m playwright install-deps firefox
          python -m camoufox fetch
      - name: Probe
        run: python probe_imobiliare_browser4.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: imo-listing-dump
          path: |
            listing_p1.html
            listing_p2.html
            responses.json
