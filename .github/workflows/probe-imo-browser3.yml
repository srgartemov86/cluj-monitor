name: probe-imo-browser3
on:
  workflow_dispatch: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        headless: ['true', 'virtual']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install camoufox
        run: |
          pip install playwright camoufox
          python -m playwright install-deps firefox
          sudo apt-get install -y xvfb
          python -m camoufox fetch
      - name: Probe
        run: python probe_imobiliare_browser3.py ${{ matrix.headless }}
